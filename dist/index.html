<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071528">
<meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/app-icon.svg">
<title>随手账本</title><meta name="description" content="个人收支时间轴、预算和债务明细">
<style>
:root{--bg:#071528;--p:#10233b;--p2:#172d49;--ink:#f5f8ff;--muted:#94a8c0;--green:#57e39b;--blue:#67a8ff;--red:#ff7d84;--amber:#ffc568;--line:#ffffff17;--shadow:0 18px 48px #0005}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{margin:0;background:radial-gradient(circle at 85% -10%,#3f7cdc3d,transparent 34%),var(--bg)}button,input,select{font:inherit}.app{max-width:900px;margin:auto;min-height:100vh;padding:22px 18px 112px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#173454,#0c1e34);display:grid;place-items:center;color:var(--green);font-weight:900}.top h1{font-size:1.15rem;margin:0}.top p{font-size:.82rem;margin:3px 0 0;color:var(--muted)}.icon{border:1px solid var(--line);background:var(--p);color:var(--ink);width:42px;height:42px;border-radius:14px}.view,.pane{display:none}.view.active,.pane.active{display:block}.hero{background:linear-gradient(135deg,#173657,#0e223a 68%);border:1px solid var(--line);border-radius:25px;padding:23px;box-shadow:var(--shadow)}.muted,.eyebrow{color:var(--muted);font-size:.8rem}.balance{font-size:2.25rem;font-weight:800;margin:6px 0 18px}.balance small{font-size:1rem;color:var(--muted)}.hero-row{display:flex;gap:24px;flex-wrap:wrap}.hero-stat span{color:var(--muted);font-size:.76rem}.hero-stat b{display:block;margin-top:4px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0 22px}.quick button{border:0;border-radius:17px;padding:14px 6px;background:var(--p);color:var(--ink);font-weight:700}.quick button:first-child{background:var(--green);color:#082117}.quick i{display:block;font-style:normal;font-size:1.15rem;margin-bottom:5px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 11px}.section-head h2{font-size:1rem;margin:0}.section-head span,.link{font-size:.78rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:var(--p);border:1px solid var(--line);border-radius:19px;padding:16px}.card span{font-size:.77rem;color:var(--muted)}.card strong{font-size:1.17rem;display:block;margin:7px 0}.good{color:var(--green)!important}.bad{color:var(--red)!important}.transactions{display:grid;gap:9px}.tx{display:grid;grid-template-columns:43px 1fr auto;gap:11px;align-items:center;background:var(--p);border:1px solid var(--line);padding:12px;border-radius:16px}.tx-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:var(--p2)}.tx h3{font-size:.88rem;margin:0 0 4px;line-height:1.35}.tx p{font-size:.73rem;color:var(--muted);margin:0}.amt{font-weight:800;white-space:nowrap}.amt.in{color:var(--green)}.amt.opening{color:var(--blue);font-size:.8rem}.title{font-size:1.5rem;margin:5px 0}.sub{color:var(--muted);font-size:.86rem;margin:0 0 18px}.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--p);padding:5px;border-radius:15px}.seg.three{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.seg button{border:0;background:transparent;color:var(--muted);padding:11px 5px;border-radius:11px;font-weight:700}.seg button.active{background:var(--green);color:#082117}.form{display:grid;gap:16px}.field label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:15px;padding:14px}.money-input{font-size:2rem!important;font-weight:800;text-align:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.submit{border:0;background:var(--green);color:#082117;border-radius:16px;padding:15px;font-weight:900}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{border:1px solid var(--line);background:var(--p);color:var(--muted);border-radius:999px;padding:9px 14px;white-space:nowrap}.chip.active{border-color:#57e39b77;color:var(--green);background:#57e39b17}.range{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.range.show{display:grid}.range input{width:100%;color-scheme:dark;background:var(--p);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.summary div{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:11px}.summary span{display:block;color:var(--muted);font-size:.7rem}.summary b{display:block;margin-top:5px;font-size:.9rem}.day{margin:16px 1px 8px;display:flex;justify-content:space-between;align-items:center}.day h3{margin:0;font-size:.9rem}.day span{color:var(--muted);font-size:.72rem}.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.project{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:15px}.project h3{font-size:.92rem;margin:7px 0}.project p{font-size:.75rem;color:var(--muted);margin:0}.debt-total{background:linear-gradient(135deg,#ffc56829,#10233be6);border:1px solid #ffc56844;border-radius:22px;padding:19px;margin-bottom:13px}.debt-total strong{display:block;font-size:1.75rem;margin:5px 0}.debt-list{display:grid;gap:9px}.debt{background:var(--p);border:1px solid var(--line);border-radius:17px;overflow:hidden}.debt summary{list-style:none;cursor:pointer;padding:15px;display:grid;grid-template-columns:1fr auto;gap:8px}.debt summary::-webkit-details-marker{display:none}.debt h3{font-size:.91rem;margin:0 0 5px}.debt summary p{margin:0;color:var(--muted);font-size:.73rem}.debt-bal{font-weight:800;color:var(--amber);text-align:right}.debt-body{border-top:1px solid var(--line);padding:14px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fact{background:var(--p2);border-radius:11px;padding:10px}.fact span{display:block;color:var(--muted);font-size:.68rem}.fact b{display:block;margin-top:4px;font-size:.82rem}.debt-note{color:var(--muted);font-size:.75rem;line-height:1.55;margin:11px 1px 0}.settings{display:grid;gap:11px}.setting{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:15px;display:flex;justify-content:space-between;align-items:center}.setting small{display:block;color:var(--muted);margin-top:4px}.danger{border:1px solid #ff7d844d;background:#ff7d8414;color:var(--red);border-radius:15px;padding:13px;font-weight:700}.bottom{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,720px);padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:#071528eb;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:none;color:var(--muted);font-size:.73rem;padding:4px}.nav i{display:block;font-style:normal;font-size:1.18rem;margin-bottom:4px}.nav.active{color:var(--green)}.fab{position:fixed;right:20px;bottom:93px;border:0;width:58px;height:58px;border-radius:20px;background:var(--green);color:#082117;font-size:1.8rem;box-shadow:var(--shadow)}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);background:#f5f8ff;color:#0b1c31;padding:11px 17px;border-radius:999px;font-weight:700;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;color:var(--muted);padding:34px}
@media(max-width:650px){.app{padding:18px 14px 108px}.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1}.quick button{font-size:.73rem}.projects{grid-template-columns:1fr}.row{grid-template-columns:1fr}.summary b{font-size:.8rem}}
</style></head><body>
<main class="app"><header class="top"><div class="brand"><div class="logo">¥</div><div><h1>随手账本</h1><p id="today"></p></div></div><button class="icon" onclick="exportData()">⇩</button></header>
<button id="installBtn" hidden style="width:100%;margin-bottom:14px;border:1px solid #57e39b77;background:#57e39b17;color:#79efae;border-radius:16px;padding:13px;font-weight:800">安装到手机</button>
<section id="overview" class="view active"><div class="hero"><div class="eyebrow">人民币现金</div><div class="balance"><small>¥</small> <span id="cash"></span></div><div class="hero-row"><div class="hero-stat"><span>银行卡</span><b id="bank"></b></div><div class="hero-stat"><span>微信</span><b id="wechat"></b></div><div class="hero-stat"><span>可支配</span><b id="spendable"></b></div></div></div>
<div class="quick"><button onclick="openRecord('expense')"><i>−</i>记支出</button><button onclick="openRecord('income')"><i>＋</i>记收入</button><button onclick="openHistory('timeline')"><i>◷</i>时间轴</button><button onclick="openHistory('debt')"><i>▣</i>看债务</button></div>
<div class="section-head"><h2>本月概览</h2><span id="overviewMonth"></span></div><div class="grid"><div class="card"><span>本月支出</span><strong id="monthSpend"></strong><span class="bad">含债务与订阅</span></div><div class="card" onclick="openHistory('debt')"><span>未来债务</span><strong id="overviewDebt"></strong><span class="good">查看债务明细</span></div><div class="card"><span>历史起点</span><strong id="firstRecord"></strong><span class="good">完整时间轴</span></div></div><div class="section-head"><h2>最近记录</h2><button class="link" onclick="openHistory('timeline')" style="border:0;background:none">查看全部</button></div><div id="recent" class="transactions"></div></section>
<section id="record" class="view"><h2 class="title">记一笔</h2><p class="sub">保存后会自动进入时间轴。</p><form class="form" id="entryForm"><div class="seg"><button type="button" data-kind="expense" class="active">支出</button><button type="button" data-kind="income">收入</button></div><div class="field"><label>金额</label><input id="moneyInput" class="money-input" type="number" step=".01" min="0" placeholder="0.00" required></div><div class="row"><div class="field"><label>项目</label><select id="category"></select></div><div class="field"><label>账户</label><select id="account"><option>银行卡</option><option>微信</option><option>现金</option><option>信用卡</option></select></div></div><div class="field"><label>说明</label><input id="note" placeholder="例如：买水、物业费"></div><button class="submit">保存记录</button></form></section>
<section id="history" class="view"><h2 class="title">账目与债务</h2><p class="sub">从第一笔记录开始，按时间追溯全部账目。</p><div class="seg three"><button data-tab="timeline" class="active">时间轴</button><button data-tab="projects">项目</button><button data-tab="debt">债务</button></div>
<div id="timelinePane" class="pane active"><div class="chips"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="month">本月</button><button class="chip" data-filter="7d">近7天</button><button class="chip" data-filter="custom">自定义</button></div><div id="range" class="range"><input type="date" id="fromDate"><input type="date" id="toDate"></div><div id="timeSummary" class="summary"></div><div id="timeline"></div></div>
<div id="projectsPane" class="pane"><div id="projectGrid" class="projects"></div></div><div id="debtPane" class="pane"><div class="debt-total"><span class="muted">未来应还合计</span><strong id="debtTotal"></strong><span class="muted" id="debtMonthly"></span></div><div id="debtList" class="debt-list"></div></div></section>
<section id="profile" class="view"><h2 class="title">账户与数据</h2><p class="sub">当前数据保存在这台手机的浏览器中。</p><div class="settings"><div class="setting"><div><b>银行卡</b><small>当前账面余额</small></div><strong id="sBank"></strong></div><div class="setting"><div><b>微信</b><small>可按实际余额修正</small></div><strong id="sWechat"></strong></div><div class="setting"><div><b>完整历史</b><small id="historyCount"></small></div><span>→</span></div><button class="setting" onclick="exportData()"><div><b>导出备份</b><small>下载JSON，可长期保存</small></div><span>→</span></button><button class="danger" onclick="resetApp()">恢复账本初始数据</button></div></section></main>
<button class="fab" onclick="openRecord('expense')">＋</button><nav class="bottom"><button class="nav active" data-view="overview"><i>⌂</i>总览</button><button class="nav" data-view="record"><i>＋</i>记一笔</button><button class="nav" data-view="history"><i>◷</i>时间轴</button><button class="nav" data-view="profile"><i>●</i>我的</button></nav><div class="toast" id="toast">已保存</div>
<script>
const historySeed=[],debts=[];
const seed={bank:0,wechat:0,reserve:0,monthSpend:0,historyVersion:2,entries:[]};
const meta={食品:['🍜',0],宠物:['🐾',0],日用品:['🧻',0],交通:['🛵',0],物业水电:['💡',0],话费:['📱',0],订阅:['◈',0],债务:['▣',0],混合支出:['◫',0],其他:['•••',0]};
const localToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const thisMonth=()=>localToday().slice(0,7);
const monthOut=()=>Math.round(state.entries.filter(e=>e.kind==='expense'&&e.date.startsWith(thisMonth())).reduce((sum,e)=>sum+Math.round(e.amount*100),0))/100;
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=JSON.parse(localStorage.getItem('blank-finance-v1')||'null');let state=saved||structuredClone(seed),kind='expense',filter='all';
$('today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
function balance(){return Number(state.bank||0)+Number(state.wechat||0)}function save(){localStorage.setItem('blank-finance-v1',JSON.stringify(state));render()}
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===id));scrollTo(0,0)}
function openHistory(tab='timeline'){showView('history');setTab(tab)}function setTab(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));['timeline','projects','debt'].forEach(x=>$(x+'Pane').classList.toggle('active',x===tab))}
function openRecord(k){kind=k;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x.dataset.kind===k));fillCats();showView('record');setTimeout(()=>$('moneyInput').focus(),150)}
function fillCats(){const a=kind==='expense'?Object.keys(meta):['工资','微信收入','退款','其他收入'];$('category').innerHTML=a.map(x=>'<option>'+x+'</option>').join('')}
function icon(c){return meta[c]?.[0]||(c.includes('收入')||c==='工资'?'↗':c==='期初余额'?'◎':'¥')}function pretty(d){return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00:00'))}
function tx(e,del=false){let sign=e.kind==='income'?'+':e.kind==='expense'?'−':'';return `<div class="tx"><div class="tx-icon">${icon(e.category)}</div><div><h3>${esc(e.note||e.category)}</h3><p>${esc(e.category)} · ${esc(e.account)}</p></div><div><div class="amt ${e.kind==='income'?'in':e.kind==='balance'?'opening':''}">${e.kind==='balance'?(e.balanceDelta!==undefined?(e.balanceDelta>=0?'+':'−')+money(Math.abs(e.balanceDelta)):'期初'):sign+money(e.amount)}</div>${del&&!e.sourceId?`<button onclick="removeEntry('${e.id}')" style="float:right;border:0;background:none;color:#94a8c0;margin-top:4px">删除</button>`:''}</div></div>`}
function filtered(){let a=[...state.entries].sort((x,y)=>y.date.localeCompare(x.date)||String(y.id).localeCompare(String(x.id)));if(filter==='month')a=a.filter(e=>e.date.startsWith(thisMonth()));if(filter==='7d')a=a.filter(e=>e.date>=new Date(Date.parse(localToday()+'T12:00:00Z')-6*86400000).toISOString().slice(0,10)&&e.date<=localToday());if(filter==='custom')a=a.filter(e=>e.date>=($('fromDate').value||'0000')&&e.date<=($('toDate').value||'9999'));return a}
function renderTimeline(){const a=filtered(),inc=a.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0),out=a.filter(e=>e.kind==='expense').reduce((s,e)=>s+e.amount,0);$('timeSummary').innerHTML=`<div><span>收入</span><b class="good">${money(inc)}</b></div><div><span>支出</span><b>${money(out)}</b></div><div><span>净额</span><b class="${inc-out>=0?'good':'bad'}">${money(inc-out)}</b></div>`;const g=a.reduce((o,e)=>((o[e.date]??=[]).push(e),o),{});$('timeline').innerHTML=Object.keys(g).sort().reverse().map(d=>{let es=g[d],di=es.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0),doo=es.filter(e=>e.kind==='expense').reduce((s,e)=>s+e.amount,0);return `<div class="day"><h3>${pretty(d)}</h3><span>${di?'+ '+money(di)+' · ':''}支出 ${money(doo)}</span></div><div class="transactions">${es.map(e=>tx(e,true)).join('')}</div>`}).join('')||'<div class="empty">这个时间范围内没有记录</div>'}
function renderProjects(){let a=state.entries.filter(e=>e.kind==='expense'&&e.date.startsWith(thisMonth()));$('projectGrid').innerHTML=Object.entries(meta).map(([n,[em,b]])=>{let s=a.filter(e=>e.category===n).reduce((x,e)=>x+e.amount,0);return `<article class="project"><span style="font-size:1.4rem">${em}</span><h3>${n}</h3><p>${thisMonth()}</p><strong>${money(s)}${b?' / '+money(b):''}</strong></article>`}).join('')}
function renderDebts(){let total=debts.reduce((s,d)=>s+d.balance,0),monthly=debts.reduce((s,d)=>s+d.payment,0);$('debtTotal').textContent=money(total);$('debtMonthly').textContent=`共 ${debts.length} 项 · 当前月供合计 ${money(monthly)}`;$('debtList').innerHTML=[...debts].sort((a,b)=>a.priority-b.priority).map(d=>`<details class="debt"><summary><div><h3>${esc(d.name)}</h3><p>${d.periods}期 · 每月${money(d.payment)} · ${esc(d.due)}</p></div><div class="debt-bal">${money(d.balance)}<div class="muted">展开 ›</div></div></summary><div class="debt-body"><div class="facts"><div class="fact"><span>原始金额</span><b>${money(d.original)}</b></div><div class="fact"><span>剩余期数</span><b>${d.periods}期</b></div><div class="fact"><span>年利率</span><b>${d.apr==null?'待确认':(d.apr*100).toFixed(1)+'%'}</b></div><div class="fact"><span>结束时间</span><b>${d.end||'按信用卡账单'}</b></div><div class="fact"><span>还款日</span><b>${esc(d.due)}</b></div><div class="fact"><span>优先级</span><b>第${d.priority}位</b></div></div><p class="debt-note">${esc(d.note)}</p></div></details>`).join('')||'<div class="empty">暂无债务记录</div>'}
function render(){state.monthSpend=monthOut();$('overviewMonth').textContent=thisMonth();$('overviewDebt').textContent=money(debts.reduce((sum,d)=>sum+d.balance,0));$('firstRecord').textContent=state.entries.length?[...state.entries].map(e=>e.date).sort()[0]:'暂无记录';let c=balance();$('cash').textContent=c.toFixed(2);$('bank').textContent=Number(state.bank).toFixed(2);$('wechat').textContent=Number(state.wechat).toFixed(2);$('spendable').textContent=(c-state.reserve).toFixed(2);$('monthSpend').textContent=money(state.monthSpend);$('sBank').textContent=money(state.bank);$('sWechat').textContent=money(state.wechat);$('historyCount').textContent=state.entries.length?`${state.entries.length}条，始于${[...state.entries].map(e=>e.date).sort()[0]}`:"暂无记录";$('recent').innerHTML=[...state.entries].filter(e=>e.kind!=='balance').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(e=>tx(e)).join('')||'<div class="empty">暂无记录，点击“记一笔”开始。</div>';renderTimeline();renderProjects();renderDebts()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showView(b.dataset.view));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));fillCats()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));$('range').classList.toggle('show',filter==='custom');renderTimeline()});$('fromDate').onchange=$('toDate').onchange=renderTimeline;
$('entryForm').onsubmit=e=>{e.preventDefault();let amount=Number($('moneyInput').value);if(!amount)return;let acct=$('account').value,en={id:'local-'+Date.now(),date:new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),kind,amount,category:$('category').value,account:acct,note:$('note').value.trim()};state.entries.unshift(en);if(acct==='银行卡')state.bank+=kind==='income'?amount:-amount;if(acct==='微信')state.wechat+=kind==='income'?amount:-amount;if(kind==='expense')state.monthSpend+=amount;save();$('entryForm').reset();fillCats();showView('overview');flash('已保存到时间轴')};
function removeEntry(id){let e=state.entries.find(x=>String(x.id)===String(id));if(!e||e.sourceId||!confirm('删除这笔记录？'))return;if(e.account==='银行卡')state.bank+=e.kind==='income'?-e.amount:e.amount;if(e.account==='微信')state.wechat+=e.kind==='income'?-e.amount:e.amount;if(e.kind==='expense')state.monthSpend-=e.amount;state.entries=state.entries.filter(x=>String(x.id)!==String(id));save()}function flash(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...state,debts},null,2)],{type:'application/json'}));a.download='随手账本完整备份.json';a.click();URL.revokeObjectURL(a.href)}function resetApp(){if(confirm('恢复到账本初始数据？你在App新增的记录会被清除。')){state=structuredClone(seed);save();showView('overview')}}
fillCats();save();let installPrompt=null,installBtn=$('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true};window.addEventListener('appinstalled',()=>{installBtn.hidden=true;flash('已安装到手机')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
if(document.modelContext?.registerTool){Promise.resolve(document.modelContext.registerTool({name:'get_finance_entries',title:'按时间读取收支记录',description:'按起止日期读取全部收支。',inputSchema:{type:'object',properties:{from:{type:'string'},to:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:true},execute:i=>state.entries.filter(e=>(!i.from||e.date>=i.from)&&(!i.to||e.date<=i.to))})).catch(()=>{});Promise.resolve(document.modelContext.registerTool({name:'get_debt_details',title:'读取债务明细',description:'读取债务余额、月供、期数、还款日和优先级。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>debts})).catch(()=>{})}
</script>
